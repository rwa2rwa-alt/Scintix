<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>نتيجة تمارا | كامينوتك</title>
<link rel="stylesheet" href="css/styles.css"/>
<style>
.res-wrap{max-width:540px;margin:0 auto;padding:64px 20px;text-align:center}
.res-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:38px 28px}
.res-icon{font-size:2.8rem;margin-bottom:14px}.res-title{font-size:1.45rem;font-weight:800;margin:0 0 12px}
.res-body{color:var(--text-muted);line-height:1.9;margin:0 0 24px}.ok{color:#4ade80}.bad{color:#f87171}.wait{color:var(--accent)}
</style>
</head>
<body>
<div class="res-wrap">
  <a class="brand" href="index.html" style="justify-content:center;margin-bottom:26px">
    <img class="brand-logo" src="assets/logo.png" alt="كامينوتك"/>
    <span class="brand-name">Caminotich</span>
  </a>
  <div class="res-card">
    <div class="res-icon wait" id="icon">⏳</div>
    <h1 class="res-title" id="title">جاري معالجة طلب تمارا…</h1>
    <p class="res-body" id="body">سنؤكد حالة الطلب بعد وصول إشعار تمارا الآمن.</p>
    <a class="btn btn-primary" id="result-action" href="index.html">العودة للرئيسية</a>
  </div>
</div>
<script>
var result = new URLSearchParams(location.search).get("result") || "";
var icon = document.getElementById("icon");
var title = document.getElementById("title");
var body = document.getElementById("body");
var action = document.getElementById("result-action");
var token = new URLSearchParams(location.search).get("t") || "";
if (result === "success") {
  icon.className = "res-icon wait"; icon.textContent = "⏳";
  title.textContent = "جاري تأكيد الدفع…";
  body.textContent = "يرجى الانتظار لحظات حتى تكتمل مطابقة طلب تمارا.";

  function reconcile(attempt) {
    fetch("/api/tamara/reconcile", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ t: token })
    })
    .then(function(response){ return response.json(); })
    .then(function(data){
      if (data && data.ok && data.status === "fully_captured") {
        icon.className = "res-icon ok"; icon.textContent = "✓";
        title.textContent = "تم تأكيد الدفع بنجاح";
        body.textContent = "اكتملت عملية تمارا وتم تسجيل السداد على عقدك.";
      } else if (attempt < 3) {
        setTimeout(function(){ reconcile(attempt + 1); }, 2500);
      } else {
        icon.className = "res-icon wait"; icon.textContent = "⏳";
        title.textContent = "طلبك قيد التأكيد";
        body.textContent = "استلمنا طلب تمارا وسنؤكد السداد تلقائيًا بعد اكتمال المعالجة.";
      }
    })
    .catch(function(){
      if (attempt < 3) setTimeout(function(){ reconcile(attempt + 1); }, 2500);
      else {
        title.textContent = "طلبك قيد التأكيد";
        body.textContent = "استلمنا طلب تمارا وسنؤكد السداد تلقائيًا بعد اكتمال المعالجة.";
      }
    });
  }
  reconcile(1);
} else if (result === "failure") {
  icon.className = "res-icon bad"; icon.textContent = "❌";
  title.textContent = "لم يكتمل طلب تمارا";
  body.textContent = "لم تتم الموافقة على العملية. يمكنك العودة وتجربة وسيلة دفع أخرى.";
  action.textContent = "العودة لخيارات الدفع";
  action.href = "payment.html?t=" + encodeURIComponent(token);
  reconcileFailureState();
} else if (result === "cancel") {
  icon.className = "res-icon wait"; icon.textContent = "↩";
  title.textContent = "تم إلغاء العملية";
  body.textContent = "لم يتم تحصيل أي مبلغ. يمكنك العودة للدفع في أي وقت.";
  action.textContent = "العودة لخيارات الدفع";
  action.href = "payment.html?t=" + encodeURIComponent(token);
  reconcileFailureState();
}

function reconcileFailureState() {
  if (!token) return;
  fetch("/api/tamara/reconcile", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ t: token })
  }).catch(function(){});
}
</script>
</body>
</html>
