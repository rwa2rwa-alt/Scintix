const P = new URLSearchParams(window.location.search);
const pkgKey = (P.get('pkg') || 'spark').toLowerCase();
const pkg = PKGS[pkgKey] || PKGS.spark;
let currentLang = localStorage.getItem('caminotich-lang') || 'ar';

function renderPkg(lang){
  const data = pkg[lang] || pkg.ar;
  const s = STR[lang] || STR.ar;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';

  document.getElementById('pkgBadge').textContent = data.name.toUpperCase();
  document.getElementById('pkgName').textContent = data.name;
  document.getElementById('pkgTagline').textContent = data.tagline;
  /* العملة — عرض فقط، التحصيل دائماً بالريال. نفس سعر الصرف في الرئيسية. */
  const RATE_USD_PLAN = 3.754;
  const cur = localStorage.getItem('caminotich-currency') === 'usd' ? 'usd' : 'sar';
  const curSel = document.querySelector('[data-currency-select]');
  if (curSel) curSel.value = cur;

  document.getElementById('pkgPrice').textContent = cur === 'usd'
    ? '$ ' + (pkg.price / RATE_USD_PLAN).toLocaleString('en-US',
              { minimumFractionDigits: 2, maximumFractionDigits: 2 })
    : pkg.price.toLocaleString('en-US');
  document.getElementById('pkgPriceUnit').textContent = cur === 'usd' ? s.unitUsd : s.unitSar;

  const noteEl = document.getElementById('pkgBillingNote');
  if (noteEl) {
    noteEl.textContent   = s.billingNote;
    noteEl.style.display = cur === 'usd' ? 'block' : 'none';
  }
  /* المدة والملاحظة — نُقلتا من الرئيسية */
  const ex = (PKG_EXTRA[pkgKey] || {})[lang] || (PKG_EXTRA[pkgKey] || {}).ar || {dur:'',note:''};
  const durEl = document.getElementById('pkgDuration');
  if (durEl) durEl.textContent = ex.dur ? (STR_EXTRA[lang]||STR_EXTRA.ar).durLabel + ': ' + ex.dur : '';
  const pnEl = document.getElementById('pkgPlanNote');
  if (pnEl) { pnEl.textContent = ex.note || ''; pnEl.style.display = ex.note ? 'block' : 'none'; }

  document.getElementById('featuresTitle').textContent = s.featuresTitle;
  document.getElementById('backLink').textContent = s.back;
  document.getElementById('ctaStart').textContent = s.cta;
  document.getElementById('videoComingSoon').textContent = s.videoSoon;

  const list = document.getElementById('featuresList');
  list.innerHTML = '';
  data.features.forEach(f => {
    const li = document.createElement('li');
    li.textContent = f;
    list.appendChild(li);
  });

  document.getElementById('pkgFaqTitle').textContent = lang === 'ar' ? 'أسئلة شائعة عن هذه الباقة' : 'FAQ about this plan';
  const faqList = document.getElementById('pkgFaqList');
  faqList.innerHTML = '';
  (data.faq || []).forEach(item => {
    const details = document.createElement('details');
    details.className = 'faq-item';
    const summary = document.createElement('summary');
    const qSpan = document.createElement('span');
    qSpan.textContent = item.q;
    const iconSpan = document.createElement('span');
    iconSpan.className = 'faq-icon';
    iconSpan.textContent = '+';
    summary.append(qSpan, iconSpan);
    const p = document.createElement('p');
    p.textContent = item.a;
    details.append(summary, p);
    faqList.appendChild(details);
  });

  document.getElementById('ctaStart').href = `quote.html?package=${encodeURIComponent(data.name)}`;

  // سطر الصيانة الاختيارية
  const maintEl = document.getElementById('pkgMaint');
  if (maintEl) {
    if (!pkg.maint) { maintEl.textContent = ''; }
    else if (cur === 'usd') {
      maintEl.textContent = s.maintUsd.replace('{n}',
        (pkg.maint / RATE_USD_PLAN).toFixed(2));
    } else {
      maintEl.textContent = s.maintSar.replace('{n}', pkg.maint);
    }
  }

  // الفيديو: تحميل كسول — لا يُطلب من يوتيوب إلا عند الضغط
  const videoEl = document.getElementById('pkgVideo');
  const placeholderEl = document.getElementById('videoPlaceholder');
  const vid = pkg.video && pkg.video[lang];
  videoEl.src = '';
  videoEl.style.display = 'none';
  placeholderEl.style.display = 'block';
  if (vid) {
    document.getElementById('videoComingSoon').textContent =
      lang === 'en' ? 'Watch the intro video' : 'شاهد الفيديو التعريفي';
    placeholderEl.onclick = function () {
      videoEl.src = 'https://www.youtube-nocookie.com/embed/' + vid + '?autoplay=1&rel=0';
      videoEl.style.display = 'block';
      placeholderEl.style.display = 'none';
    };
  } else {
    placeholderEl.onclick = null;
  }

  document.title = `Caminotich | ${data.name}`;
}

function setDetailCurrency(cur){
  localStorage.setItem('caminotich-currency', cur === 'usd' ? 'usd' : 'sar');
  renderPkg(currentLang);
}

function setDetailLang(lang){
  currentLang = lang;
  localStorage.setItem('caminotich-lang', lang);
  renderPkg(lang);
}

renderPkg(currentLang);
document.querySelector('[data-lang-select]').value = currentLang;</script>
