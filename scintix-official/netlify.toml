    Cache-Control           = "no-store, max-age=0"
    X-Robots-Tag            = "noindex, nofollow"
[[redirects]]
  from = "/preview"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/preview/"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/internal/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/preview/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

