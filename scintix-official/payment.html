<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>إتمام الدفع | كامينوتك</title>
<link rel="stylesheet" href="css/styles.css"/>
<!-- ⚠️ حدّثي رقم الإصدار من: https://docs.moyasar.com/guides/card-payments/basic-integration -->
<link rel="stylesheet" href="https://cdn.moyasar.com/mpf/1.15.0/moyasar.css"/>
<script src="https://cdn.moyasar.com/mpf/1.15.0/moyasar.js"></script>
<style>
  .pay-wrap{max-width:560px;margin:0 auto;padding:48px 20px}
  .pay-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:28px}
  .pay-sum{display:flex;justify-content:space-between;align-items:baseline;
           padding:14px 0;border-bottom:1px solid var(--border)}
  .pay-total{font-size:1.6rem;font-weight:800;color:var(--accent)}
  .pay-note{font-size:.82rem;color:var(--text-muted);margin-top:18px;line-height:1.7}
  .pay-err{background:rgba(220,80,80,.12);border:1px solid rgba(220,80,80,.4);
           border-radius:12px;padding:16px;color:#ffb4b4}
</style>
</head>
<body>
<div class="pay-wrap">
  <a class="brand" href="index.html" style="justify-content:center;margin-bottom:24px">
    <img class="brand-logo" src="assets/logo.png" alt="كامينوتك"/>
    <span class="brand-name">Caminotich</span>
  </a>

  <div class="pay-card">
    <div class="pay-sum">
      <span>الباقة</span><strong id="pkg-name">—</strong>
    </div>
    <div class="pay-sum" style="border:none">
      <span>الإجمالي شامل ضريبة القيمة المضافة</span>
      <span class="pay-total" id="pkg-total">—</span>
    </div>

    <div id="mysr-host" style="margin-top:22px">
      <div class="mysr-form"></div>
    </div>

    <div id="pay-blocked" class="pay-err" style="display:none;margin-top:22px"></div>

    <p class="pay-note">
      بيانات بطاقتك تُدخل مباشرة في نموذج ميسر المؤمّن ولا تمر عبر خوادم كامينوتك إطلاقاً.
      سيتم تحويلك لصفحة التحقق البنكي (3D Secure) قبل إتمام العملية.
    </p>
  </div>
</div>

<script>
/* أسعار الباقات بالهللات — دفعة واحدة */
var PACKAGES = {
  Spark:  { label: 'Spark',  halalas:   89900 },
  Glow:   { label: 'Glow',   halalas:  179900 },
  Pulse:  { label: 'Pulse',  halalas:  329900 },
  Nova:   { label: 'Nova',   halalas:  599900 },
  Zenith: { label: 'Zenith', halalas: 1200000, invoiceOnly: true }
};

var qs       = new URLSearchParams(location.search);
var pkgKey   = (qs.get('package') || '').trim();
var recordId = (qs.get('record')  || '').trim();
var pkg      = PACKAGES[pkgKey];

var elName = document.getElementById('pkg-name');
var elTot  = document.getElementById('pkg-total');
var elHost = document.getElementById('mysr-host');
var elErr  = document.getElementById('pay-blocked');

function block(msg){
  elHost.style.display = 'none';
  elErr.style.display  = 'block';
  elErr.innerHTML      = msg;
}

if (!pkg) {
  elName.textContent = 'غير محددة';
  block('لم يتم تحديد الباقة. رجاءً ارجعي لصفحة الباقات واختاري باقتك.<br>'
      + '<a href="index.html#plans">← صفحة الباقات</a>');
} else {
  elName.textContent = pkg.label;
  elTot.textContent  = (pkg.halalas / 100).toLocaleString('en-US') + ' ريال';
  var approx = document.createElement('div');
  approx.style.cssText = 'font-size:.78rem;color:var(--text-muted);text-align:left;margin-top:4px';
  approx.textContent = '≈ $ ' + (pkg.halalas / 100 / 3.754).toFixed(2)
                     + ' — يُحصّل بالريال السعودي';
  elTot.parentNode.appendChild(approx);

  if (pkg.invoiceOnly) {
    block('باقة Zenith تُسدَّد عبر فاتورة أو تحويل بنكي بدل الدفع بالبطاقة.<br>'
        + 'تواصلي معنا على <a href="mailto:info@caminotich.sa">info@caminotich.sa</a> ونصدر لك الفاتورة.');
  } else {
    Moyasar.init({
      element: '.mysr-form',
      amount: pkg.halalas,
      currency: 'SAR',
      description: 'باقة ' + pkg.label + ' — كامينوتك' + (recordId ? ' | ' + recordId : ''),
      /* مفتاح النشر — آمن في الواجهة. للانتقال للإنتاج بدّليه بـ pk_live_ */
      publishable_api_key: 'pk_test_34GwBonUQjx8qJJyN6w7Hv9LvihR6rwAkxhixuiW',
      callback_url: 'https://caminotich.sa/payment-result.html',
      methods: ['creditcard'],
      supported_networks: ['mada', 'visa', 'mastercard'],
      metadata: {
        package: pkg.label,
        airtable_record_id: recordId
      }
    });
  }
}
</script>
</body>
</html>
