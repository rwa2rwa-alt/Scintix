<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>إتمام الدفع | كامينوتك</title>
<link rel="stylesheet" href="css/styles.css"/>
<!-- ⚠️ حدّثي رقم الإصدار من: https://docs.moyasar.com/guides/card-payments/basic-integration -->
<link rel="stylesheet" href="https://cdn.moyasar.com/mpf/1.15.0/moyasar.css"/>
<script src="https://cdn.moyasar.com/mpf/1.15.0/moyasar.js"></script>
<style>
  .pay-wrap{max-width:560px;margin:0 auto;padding:48px 20px}
  .pay-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:28px}
  .pay-sum{display:flex;justify-content:space-between;align-items:baseline;
           padding:14px 0;border-bottom:1px solid var(--border)}
  .pay-total{font-size:1.6rem;font-weight:800;color:var(--accent)}
  .pay-note{font-size:.82rem;color:var(--text-muted);margin-top:18px;line-height:1.7}
  .pay-err{background:rgba(220,80,80,.12);border:1px solid rgba(220,80,80,.4);
           border-radius:12px;padding:16px;color:#ffb4b4}
</style>
</head>
<body>
<div class="pay-wrap">
  <a class="brand" href="index.html" style="justify-content:center;margin-bottom:24px">
    <img class="brand-logo" src="assets/logo.png" alt="كامينوتك"/>
    <span class="brand-name">Caminotich</span>
  </a>

  <div class="pay-card">
    <div class="pay-sum">
      <span>الباقة</span><strong id="pkg-name">—</strong>
    </div>
    <div class="pay-sum" style="border:none">
      <span>الإجمالي شامل ضريبة القيمة المضافة</span>
      <span class="pay-total" id="pkg-total">—</span>
    </div>

    <div id="mysr-host" style="margin-top:22px">
      <div class="mysr-form"></div>
    </div>

    <div id="pay-blocked" class="pay-err" style="display:none;margin-top:22px"></div>

    <p class="pay-note">
      بيانات بطاقتك تُدخل مباشرة في نموذج ميسر المؤمّن ولا تمر عبر خوادم كامينوتك إطلاقاً.
      سيتم تحويلك لصفحة التحقق البنكي (3D Secure) قبل إتمام العملية.
    </p>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════
   صفحة الدفع — المبلغ يأتي من العقد لا من الرابط.
   جدول الأسعار حُذف من هنا عمداً: أي سعر في الواجهة يعني أن من
   يعدّل الرابط يدفع ما يشاء. المبلغ الوحيد المعتمد هو قيمة العقد
   الموقّع كما يرجعها الخادم.
   ════════════════════════════════════════════════════════════════ */
var LOOKUP  = '/.netlify/functions/contract-lookup';
var PK_KEY  = 'pk_test_34GwBonUQjx8qJJyN6w7Hv9LvihR6rwAkxhixuiW'; /* بدّليه بـ pk_live_ عند الإنتاج */
var RATE_USD = 3.754;

var token  = (new URLSearchParams(location.search).get('t') || '').trim();

var elName = document.getElementById('pkg-name');
var elTot  = document.getElementById('pkg-total');
var elHost = document.getElementById('mysr-host');
var elErr  = document.getElementById('pay-blocked');

function block(msg){
  elHost.style.display = 'none';
  elErr.style.display  = 'block';
  elErr.innerHTML      = msg;
}

var CONTACT = 'تواصلي معنا على <a href="mailto:info@caminotich.sa">info@caminotich.sa</a>.';
var REASONS = {
  BAD_TOKEN:    'رابط الدفع غير صالح. استخدمي الرابط الوارد في بريد العقد.',
  NOT_FOUND:    'لم نجد عقداً بهذا الرابط. قد يكون أُلغي. ' + CONTACT,
  UNSIGNED:     'لم يُوقَّع العقد بعد. وقّعيه أولاً ثم يفتح الدفع تلقائياً.',
  ALREADY_PAID: 'هذا العقد مدفوع بالفعل. لو خُصم منك مبلغ مرتين ' + CONTACT,
  NO_VALUE:     'قيمة العقد غير مسجّلة. ' + CONTACT,
  UNAVAILABLE:  'تعذّر فتح صفحة الدفع الآن. حاولي بعد قليل أو ' + CONTACT
};

elName.textContent = '…';
elTot.textContent  = '…';

if (!token) {
  elName.textContent = 'غير محدد';
  block(REASONS.BAD_TOKEN);
} else {
  fetch(LOOKUP, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ t: token })
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    if (!d || !d.ok) {
      elName.textContent = 'غير متاح';
      elTot.textContent  = '—';
      block(REASONS[(d && d.reason) || 'UNAVAILABLE'] || REASONS.UNAVAILABLE);
      return;
    }

    elName.textContent = d.package || d.contract_name || 'عقد';
    elTot.textContent  = Number(d.amount_sar).toLocaleString('en-US') + ' ريال';

    var approx = document.createElement('div');
    approx.style.cssText = 'font-size:.78rem;color:var(--text-muted);text-align:left;margin-top:4px';
    approx.textContent = '≈ $ ' + (d.amount_sar / RATE_USD).toFixed(2) + ' — يُحصّل بالريال السعودي';
    elTot.parentNode.appendChild(approx);

    /* Zenith تُسدَّد بفاتورة أو تحويل بنكي — تُقيَّد يدوياً في سجل الدفعات */
    if (String(d.package).toLowerCase() === 'zenith') {
      block('باقة Zenith تُسدَّد عبر فاتورة أو تحويل بنكي بدل الدفع بالبطاقة.<br>' + CONTACT);
      return;
    }

    Moyasar.init({
      element: '.mysr-form',
      amount: d.halalas,
      currency: 'SAR',
      description: (d.contract_name || 'عقد') + ' — كامينوتك',
      publishable_api_key: PK_KEY,
      callback_url: 'https://caminotich.sa/payment-result.html?t=' + encodeURIComponent(token),
      methods: ['creditcard'],
      supported_networks: ['mada', 'visa', 'mastercard'],
      metadata: {
        contract_id:   d.contract_id,
        contract_name: d.contract_name,
        package:       d.package
      }
    });
  })
  .catch(function(){
    elName.textContent = 'غير متاح';
    elTot.textContent  = '—';
    block(REASONS.UNAVAILABLE);
  });
}
</script>
</body>
</html>
